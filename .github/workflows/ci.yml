name: CI

# Run CI when a PR is opened against the branch `master`
# and when one pushes a commit to `master`.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Run CI on all 3 latest OSes
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node toolchain
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Setup PureScript tooling
        run: npm ci

      - name: Cache PureScript dependencies
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('spago.yaml', 'spago.lock', 'package-lock.json') }}
          path: |
            .spago
            output

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check Formatting
        if: runner.os == 'Linux'
        run: npx --yes purs-tidy@0.11.1 check src test
